<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="deleteWorkspace.css" rel="stylesheet" />
    <script src="deleteWorkspace.js"></script>
</head>
<body>
    <div id="xbdh-deleteworkspace-candeleteworkspace" class="xbdh-hidden">
        <h1 data-win-res='{ "textContent": "labelConfirmTitle" }'></h1>
        <p data-win-res='{ "textContent": "deleteWorkspaceConfirmDescription" }'></p>
        <h1 id="xbdh-deleteworkspace-workspacename"></h1>
        <div class="xbdh-form-buttons">
            <button id="xbdh-deleteworkspace-deletecommand" data-win-res='{ "textContent": "commandConfirm" }' type="button"></button>
            <button id="xbdh-deleteworkspace-cancelcommand" data-win-res='{ "textContent": "commandCancel" }' type="button"></button>
        </div>
    </div>
    <div id="xbdh-deleteworkspace-cannotdeleteworkspace" class="xbdh-hidden">
        <h1 data-win-res='{ "textContent": "deleteWorkspaceCannotDeleteWorkspaceTitle" }'></h1>
        <p data-win-res='{ "textContent": "deleteWorkspaceCannotDeleteWorkspaceDescription" }'></p>
        <div class="xbdh-form-buttons">
            <button id="xbdh-deleteworkspace-closecommand" data-win-res='{ "textContent": "commandClose" }' type="button"></button>
        </div>
    </div>
</body>
</html>
