<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="../../../framework/css/slider.css" rel="stylesheet" />
    <link href="manageStorage.css" rel="stylesheet" />
    <script src="../../../framework/js/slider.js"></script>
    <script src="manageStorage.js"></script>
</head>
<body>
    <h1 data-win-res='{ "textContent": "manageStorageTitle" }'></h1>
    <p data-win-res='{ "textContent": "manageStorageDescription" }'></p>
    <div class="xbdh-spacer-medium"></div>
    <h4 class="xbdh-managestorage-devstoragesize-label" data-win-res='{ "textContent": "manageStorageLabel" }'></h4>
    <div id="xbdh-managestorage-devstoragesize" class="xbdh-managestorage-devstoragesize">
        <div id="xbdh-managestorage-devstoragesize-minvalue"></div>
        <div id="xbdh-managestorage-devstoragesize-slider" data-win-control="Microsoft.Xbox.Slider" data-win-options="{ min: 0, max: 100, value: 50 }"></div>
        <div id="xbdh-managestorage-devstoragesize-maxvalue"></div>
    </div>
    <div class="xbdh-form-buttons">
        <button id="xbdh-managestorage-savecommand" data-win-res='{ "textContent": "commandSave" }' type="button"></button>
    </div>
</body>
</html>
