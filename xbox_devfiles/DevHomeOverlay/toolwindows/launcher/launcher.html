<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="launcher.css" rel="stylesheet" />
    <script src="launcherVM.js"></script>
    <script src="launcher.js"></script>
</head>
<body>
    <button id="xbdh-launcher-addremotepackage" class="xbdh-launcher-addremotepackage" type="button" data-xbdh-contextmenu="" data-win-res='{ "textContent": "launcherAddRemoteLocation" }'></button>
    <div id="xbdh-launcher" class="xbdh-list" role="list" data-xbdh-contextmenu="#xbdh-launcher-contextmenu"></div>
    <div id="xbdh-launcher-contextmenu" class="xbdh-hidden">
        <button id="xbdh-launcher-contextmenu-suspend" data-win-res='{ "textContent": "launcherSuspend" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-resume" data-win-res='{ "textContent": "launcherResume" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-launch" data-win-res='{ "textContent": "launcherLaunch" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-terminate" data-win-res='{ "textContent": "launcherTerminate" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-uninstall" data-win-res='{ "textContent": "launcherUninstall" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-remove" data-win-res='{ "textContent": "launcherRemove" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-launchwithparameters" data-win-res='{ "textContent": "launcherLaunchWithParameters" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-appdetails" data-win-res='{ "textContent": "launcherAppDetails" }' type="button"></button>
    </div>
    <div id="xbdh-launcher-contextmenu-subpackage" class="xbdh-hidden">
        <button id="xbdh-launcher-contextmenu-subpackage-resume" data-win-res='{ "textContent": "launcherResume" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-subpackage-launch" data-win-res='{ "textContent": "launcherLaunch" }' type="button"></button>
        <button id="xbdh-launcher-contextmenu-subpackage-setdefaultapp" data-win-res='{ "textContent": "launcherSetDefaultApp" }' type="button"></button>
    </div>
</body>
</html>
