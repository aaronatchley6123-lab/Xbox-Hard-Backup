<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="consoleSettings.css" rel="stylesheet" />
    <script src="consoleSettings.js"></script>
</head>
<body>
    <div id="xbdh-consolesettings-container" class="xbdh-form" style="display:none;">
        <label for="xbdh-consolesettings-consolename" data-win-res='{ "textContent": "consoleSettingsConsoleName" }'></label>
        <input id="xbdh-consolesettings-consolename" type="text" maxlength="15" />
        <div class="xbdh-consolesettings-setting">
            <label class="xbdh-label" data-win-res='{ "textContent": "consoleSettingsOSVersion" }'></label>
            <p id="xbdh-consolesettings-osversion" class="xbdh-value"></p>
        </div>
        <div class="xbdh-consolesettings-setting">
            <label class="xbdh-label" data-win-res='{ "textContent": "consoleSettingsDevkitType" }'></label>
            <p id="xbdh-consolesettings-devkitcerttype" class="xbdh-value"></p>
        </div>
        <div class="xbdh-consolesettings-setting xbdh-consolesettings-devkitcertexpiration">
            <label class="xbdh-label" data-win-res='{ "textContent": "consoleSettingsCertificateExpirationTime" }'></label>
            <p id="xbdh-consolesettings-devkitcertexpiration-value" class="xbdh-value"></p>
        </div>
        <div class="xbdh-consolesettings-setting">
            <label class="xbdh-label" data-win-res='{ "textContent": "consoleSettingsConsoleId" }'></label>
            <p id="xbdh-consolesettings-consoleid" class="xbdh-value"></p>
        </div>
        <label for="xbdh-consolesettings-accesskey" class="xbdh-consolesettings-accesskey-label" data-win-res='{ "textContent": "consoleSettingsAccessKey" }'></label>
        <input id="xbdh-consolesettings-accesskey" class="xbdh-consolesettings-accesskey" type="text" data-win-res='{ "placeholder": "consoleSettingsAccessKeyPrompt" }' />
        <button id="xbdh-consolesettings-launchsettings" class="xbdh-consolesettings-launchsettings" data-win-res='{ "textContent": "consoleSettingsLaunchSettings" }'></button>
        <button id="xbdh-consolesettings-leavedevmode" class="xbdh-hidden" data-win-res='{ "textContent": "commonActionsLeaveDevMode" }'></button>
    </div>
</body>
</html>
