<!DOCTYPE html>
<html>
<head>
    <title></title>
    <link href="compatMode.css" rel="stylesheet" />
    <script src="compatMode.js"></script>
</head>
<body>
    <div class="xbdh-form">
        <div id="xbdh-compatmode-mode" class="xbdh-combobox xbdh-combobox-first xbdh-combobox-singlerow xbdh-button win-focusable" tabindex="0">
            <div class="xbdh-combobox-label"></div>
            <div class="xbdh-combobox-togglevisual"></div>
        </div>
        <p id="xbdh-compatmode-subtext"></p>
        <div id="xbdh-compatmode-titlecompat" class="xbdh-list-item xbdh-checkbox win-focusable" tabindex="0" style="display: none;">
            <input type="checkbox" id="xbdh-compatmode-titlecompat-input" /><label id="xbdh-compatmode-titlecompat-input-label" for="xbdh-compatmode-titlecompat-input" data-win-res='{ "textContent": "compatModeTitleCompatLabel" }'></label>
        </div>
        <p id="xbdh-compatmode-warningextramemorytext" class="xbdh-error xbdh-hidden"></p>
        <p id="xbdh-compatmode-warningstoragedrivetext" class="xbdh-error"></p>
    </div>
</body>
</html>
