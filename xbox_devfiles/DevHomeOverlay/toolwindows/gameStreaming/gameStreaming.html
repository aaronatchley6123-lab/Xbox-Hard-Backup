<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="gameStreaming.css" rel="stylesheet" />
    <script src="gameStreaming.js"></script>
</head>
<body>
    <div class="xbdh-form xbdh-gameStreaming-container xbdh-content">
        <section class="xbdh-gameStreaming-remoteConnect" aria-labelledby="xbdh-gameStreaming-remoteConnect-header">
            <div id="xbdh-gameStreaming-remoteConnect-header" class="xbdh-gameStreaming-remoteConnect-header">
                <h3 data-win-res='{ "textContent": "gameStreamingRemoteConnectTitle" }'></h3>
            </div>
            <div id="xbdh-gameStreaming-users" class="xbdh-gameStreaming-users">
                <ul id="xbdh-gameStreaming-users-list" class="xbdh-list xbdh-gameStreaming-users-list"></ul>
            </div>
        </section>
        <div class="xbdh-spacer-medium"></div>
        <hr />
        <section class="xbdh-gameStreaming-directConnect" aria-labelledby="xbdh-gameStreaming-directConnect-header">
            <div id="xbdh-gameStreaming-toggleListeningButton" class="xbdh-gameStreaming-directConnect-label win-focusable" tabindex="0" role="switch">
                <span id="xbdh-gameStreaming-directConnect-header" class="xbdh-gameStreaming-directConnect-header" data-win-res='{ "textContent": "gameStreamingDirectConnectTitle" }'></span>
                <span id="xbdh-gameStreaming-directConnect-toggle" class="xbdh-gameStreaming-directConnect-toggle">
                    <!--<span id="xbdh-gameStreaming-directConnect-status" class="xbdh-gameStreaming-directConnect-status" aria-hidden="true"></span>-->
                    <span class="xbdh-toggle-handle xbdh-gameStreaming-directConnect-toggle-visualHandle"></span>
                </span>
            </div>
            <div id="xbdh-gameStreaming-status" class="xbdh-gameStreaming-status"></div>
            <div id="xbdh-gameStreaming-change-status"></div>
            <label data-win-res='{ "textContent": "gameStreamingSelectStreamConfigLabel" }'></label>
            <div id="xbdh-gameStreaming-config" class="xbdh-combobox xbdh-combobox-singlerow xbdh-button win-focusable" tabindex="0">
                <div class="xbdh-combobox-label"></div>
                <div class="xbdh-combobox-togglevisual"></div>
            </div>
        </section>
    </div>
</body>
</html>
