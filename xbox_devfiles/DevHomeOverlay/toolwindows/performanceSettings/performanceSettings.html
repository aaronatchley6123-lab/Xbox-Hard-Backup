<!DOCTYPE html>
<html>
<head>
    <title></title>
    <link href="../../framework/css/slider.css" rel="stylesheet" />

    <script src="performanceSettings.js"></script>
</head>
<body>
    <div class="xbdh-form">
        <h4 id="xbdh-performancesettings-disabledsettings-label" class="xbdh-hidden" data-win-res='{ "textContent": "performanceSettingsDisabledSettingsLabel" }'></h4>

        </div>
        <div class="xbdh-spacer-medium"></div>
        <div id="xbdh-performancesettings-profilingsettings">
            <button id="xbdh-performancesettings-changetoolmemorysplit" class="xbdh-performancesettings-changetoolmemorysplit" data-win-res='{ "textContent": "performanceSettingsChangeExtraTitleMemorySplitCommand" }' type="button"></button>

    </div>

</html>
