<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="devstorage.css" rel="stylesheet" />
    <script src="devstorage.js"></script>
</head>
<body>
    <form>
        <div id="xbdh-devstorage-ssdenabled" class="xbdh-list-item xbdh-checkbox win-focusable xbdh-hidden" tabindex="0">
            <input type="checkbox" id="xbdh-devstorage-ssdenabled-input" /><label for="xbdh-devstorage-ssdenabled-input" id="xbdh-devstorage-ssdenabled-label" data-win-res='{ "textContent": "scorpioSsdEnabled" }'></label>
        </div>
        <p data-win-res='{ "textContent": "defaultStorageDeviceLabel" }'></p>
        <div class="xbdh-combobox xbdh-combobox-singlerow xbdh-button win-focusable" tabindex="0" id="xbdh-devstorage-defaultdevice">
            <div class="xbdh-combobox-label"></div>
            <div class="xbdh-combobox-togglevisual"></div>
        </div>
        <button tabindex="1" id="xbdh-devstorage-registerallpackagesondrive" data-win-res='{ "textContent": "devStorageToolRegisterAllPackagesOnDrive" }' type="button" disabled></button>
        <p id="xbdh-devstorage-singlestoragemessage" data-win-res='{ "textContent": "singleStorageDeviceLabel" }' class="xbdh-warning xbdh-hidden"></p>
    </form>
</body>
</html>
